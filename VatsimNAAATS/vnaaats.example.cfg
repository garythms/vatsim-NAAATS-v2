# Copy this file to "vnaaats.cfg" in the same folder as VatsimNAAATS.dll and fill it in.
# Never commit vnaaats.cfg - it holds your secret key.
server=https://vnaaats.com
key=PASTE_YOUR_API_KEY_HERE

# autotype=1 lets the web Flight Data Display type .selcal, .contactme and the natTrak .msg into EuroScope for you,
# and lets your EuroScope send the automatic RCL REQ reminders to pilots that have not requested clearance.
# (only works while EuroScope is the active window). Leave at 0 to use copy-and-paste instead.
autotype=1

# retrack=1 (default): after a EuroScope crash or lost connection, track the aircraft you had again (not ones another controller has).
# It also tracks an aircraft again if its pilot disconnects and comes back within 5 minutes (same Flight Level, Mach and SELCAL).
# Put retrack=0 here to turn it all off.

# remotelog=1 (default): the plugin sends its warnings and errors, and the end of the last session's log, to the vNAAATS server
# so problems can be found quickly (never your key or any password). remotelog=0 turns it off, remotelog=2 sends every log line.

# autoclick=1 (default): after the FDD types .contactme into EuroScope, the plugin also clicks the aircraft for you,
# so the message is sent without a manual click (the mouse goes back where it was). autoclick=0 turns it off.
# contactbutton=left (default). The mouse button the plugin clicks the aircraft with after .contactme. If your EuroScope selects aircraft with
# another button (you changed the ASEL key), set it to middle or right to match. Contact Me is not sent if the click is the wrong button.
# homefocus=0 (default). 1 presses the Home key before the plugin types a command (the old way). Leave it at 0: on an empty command line EuroScope answers
# Home by writing .contactme into it, and Home over a detailed tag sends Contact Me to that aircraft.
# chatcontact=1 (default). Contact Me selects the aircraft, types .chat and the callsign, then "Please contact me on <your frequency>." in the same
# command line. 0 uses the Contact Me key below instead.
# homecontact=1 (used when chatcontact=0). Contact Me is sent by emptying the command line, resting the mouse on the callsign and pressing the Contact Me key
# (EuroScope runs .contactme on the detailed tag). 0 goes back to typing .contactme and clicking the aircraft.
# contactkey=36 (default = Home). The Windows key code of the key EuroScope uses for Contact Me. Only change it if you remapped that key in EuroScope.
# These can also be set from the Settings button on the FDD.
# routeseconds=10 (default): a route drawn by right-clicking a callsign is erased by itself after this many seconds. routeseconds=0 keeps it
# until you right-click the callsign again.
# backgroundtype=0 (default). backgroundtype=1 is an experiment: the plugin types into EuroScope (autotype=1) without bringing it to the front,
# so Auto RCL does not need EuroScope in front and is not interrupted when you switch to another program. Turn it back to 0 if the
# messages do not arrive.
# rclfreqclick=25,67 (default). Before Auto RCL types a message, the plugin clicks 131.900 in EuroScope's channel list at the bottom left, so the
# message goes out on that channel. The two numbers are pixels from the LEFT and from the BOTTOM of the EuroScope window (the list stays at the
# same distance from the bottom). If it clicks the wrong spot (for example with Windows display scaling above 100%), change them. rclfreqclick=0
# turns the click off. It is not used with backgroundtype=1.
# highlight=1 (default): clicking an aircraft on the FDD circles it in white in EuroScope for 3 seconds. highlight=0 turns it off.

# pastemessage=1 (default). Types only ".msg CALLSIGN " and pastes the rest of a long message with Ctrl+V (Auto RCL, natTrak message): about 1 second instead of 6 to 8. pastemessage=0 types the whole message.
# Your clipboard is put back afterwards. Also set from the Settings button on the FDD.
