# Copy this file to "vnaaats.cfg" in the same folder as VatsimNAAATS.dll and fill it in.
# Never commit vnaaats.cfg - it holds your secret key.
server=https://vnaaats.com
key=PASTE_YOUR_API_KEY_HERE
# squawk=1 assigns transponder code 2000 when a clearance is sent; squawk=0 turns it off
squawk=1

# autotype=1 lets the web Flight Data Display type .selcal, .contactme and the natTrak .msg into EuroScope for you,
# and lets your EuroScope send the automatic RCL REQ reminders to pilots that have not requested clearance.
# (only works while EuroScope is the active window). Leave at 0 to use copy-and-paste instead.
autotype=1

# retrack=1 (default): after a EuroScope crash or lost connection, track the aircraft you had again (not ones another controller has).
# Put retrack=0 here to turn it off.
