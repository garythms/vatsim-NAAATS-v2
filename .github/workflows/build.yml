name: Build plugin
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The EuroScope SDK import library is not in the repo (it is distributed with the EuroScope plugin SDK).
      # Put EuroScopePlugInDll.lib in the repo's lib folder (git add -f lib/EuroScopePlugInDll.lib) to enable the build.
      - name: Check SDK library
        shell: pwsh
        run: |
          if (-not (Test-Path lib/EuroScopePlugInDll.lib)) { Write-Error "lib/EuroScopePlugInDll.lib is missing (see comment in build.yml)"; exit 1 }
      - uses: microsoft/setup-msbuild@v2
      - name: Build (Release, 32-bit)
        shell: pwsh
        run: |
          msbuild VatsimNAAATS/VatsimNAAATS.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m /nologo /v:m | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errs = Select-String -Path build.log -Pattern ' error ' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 25
            foreach ($e in $errs) { Write-Host "::error::$($e -replace '%','%25')" }
            exit $code
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VatsimNAAATS-plugin
          path: |
            **/Release/VatsimNAAATS.dll
            VatsimNAAATS/vnaaats.example.cfg
      - name: Package
        if: github.event_name == 'push' && github.ref_name == 'server-and-squawk'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item (Get-ChildItem -Recurse -Filter VatsimNAAATS.dll | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1).FullName pkg/
          Copy-Item VatsimNAAATS/vnaaats.example.cfg pkg/
          Copy-Item VatsimNAAATS/README.txt pkg/
          Copy-Item VatsimNAAATS/vNAAATS.asr pkg/
          Compress-Archive -Path pkg/* -DestinationPath VatsimNAAATS-plugin.zip -Force
      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == 'server-and-squawk'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag 2>$null
          gh release create latest-build VatsimNAAATS-plugin.zip pkg/VatsimNAAATS.dll --prerelease --target ${{ github.sha }} --title "Latest plugin build" --notes "Automatic build of the server-and-squawk branch (${{ github.sha }})."
      # Optional Discord notice when the plugin version number changes (needs the repository secret DISCORD_WEBHOOK).
      - name: Announce on Discord
        if: github.event_name == 'push' && github.ref_name == 'server-and-squawk'
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: |
          try {
            if (-not $env:DISCORD_WEBHOOK) { Write-Host "No DISCORD_WEBHOOK secret set - skipping."; exit 0 }
            $ver = (Get-Content pluginversion.txt -Raw).Trim()
            $prev = ""
            try { $prev = ((git show HEAD~1:pluginversion.txt) -join "").Trim() } catch { }
            if ($ver -eq $prev) { Write-Host "Version unchanged ($ver) - skipping."; exit 0 }
            $lines = Get-Content VatsimNAAATS/README.txt
            $notes = @(); $on = $false
            foreach ($l in $lines) {
              if ($l -match "^NEW IN $([regex]::Escape($ver))") { $on = $true; $notes += ($l -replace "^NEW IN [^:]*:?\s*", ""); continue }
              if ($on -and $l.Trim() -eq "") { break }
              if ($on) { $notes += $l }
            }
            $text = ($notes -join "`n").Trim()
            $role = ""
            $mentions = @{ parse = @() }
            if ($env:DISCORD_ROLE_ID -match '^\d+$') { $role = "<@&$($env:DISCORD_ROLE_ID)> "; $mentions = @{ parse = @(); roles = @($env:DISCORD_ROLE_ID) } }
            $msg = "$role**vNAAATS plugin $ver is out**`n"
            if ($text) { $msg += "`n$text`n" }
            $msg += "`nUpdating? Close EuroScope and replace only VatsimNAAATS.dll (keep your vnaaats.cfg): https://vnaaats.com/beta`nFirst time? https://vnaaats.com/guide"
            if ($msg.Length -gt 1900) { $msg = $msg.Substring(0, 1900) }
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType "application/json" -Body (@{ content = $msg; allowed_mentions = $mentions } | ConvertTo-Json -Depth 5) | Out-Null
            Write-Host "Posted to Discord."
          } catch { Write-Host "Discord notice failed (build is fine): $($_.Exception.Message)" }
