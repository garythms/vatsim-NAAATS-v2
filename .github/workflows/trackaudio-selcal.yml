name: TrackAudio SELCAL test build

on:
  workflow_dispatch:
  push:
    branches: [trackaudio-selcal-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      TA_REF: 34c9169d1469c3d7bb239d29750c63673b4d0e61
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout patches
        uses: actions/checkout@v7
        with:
          path: patches

      - name: Checkout TrackAudio (pinned)
        uses: actions/checkout@v7
        with:
          repository: pierr3/TrackAudio
          ref: ${{ env.TA_REF }}
          path: ta

      - name: Checkout submodules and apply patches
        shell: bash
        working-directory: ta
        run: |
          git submodule update --init --recursive backend/vcpkg
          git submodule update --init --recursive backend/extern/afv-native
          git submodule update --init --recursive backend/extern/libuiohook
          (cd backend/extern/afv-native && git checkout fc7d216fb3fee6a7d4b990fe27e2d5c1ad072f0e && git apply --verbose ../../../../patches/tools/trackaudio-selcal/afv-native-transmit-tones.patch)
          (cd backend/extern/libuiohook && git checkout unregister-hook-when-debugging)
          git apply --verbose ../patches/tools/trackaudio-selcal/trackaudio-transmit-tones.patch
          # Name shown to the user (shortcut, installed apps list). The internal name and app id stay "TrackAudio", so it replaces the
          # existing TrackAudio install and keeps its settings.
          node -e "const fs=require('fs');let t=fs.readFileSync('electron-builder-config.js','utf8');const n=t.replace(\"shortcutName: '\${productName}'\",\"shortcutName: 'TrackAudio for Oceanic'\").replace(\"uninstallDisplayName: '\${productName}'\",\"uninstallDisplayName: 'TrackAudio for Oceanic'\");if(n===t||!n.includes('TrackAudio for Oceanic')){console.error('name not changed');process.exit(1)}fs.writeFileSync('electron-builder-config.js',n)"
          grep -n "TrackAudio for Oceanic" electron-builder-config.js

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ta/package.json

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.x'

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.x'

      - name: Build backend
        shell: bash
        working-directory: ta
        run: |
          set -e
          npm install -g cmake-js
          pnpm run build:backend
          pnpm install

      - name: Build and package
        shell: bash
        working-directory: ta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build:win -- --publish=never

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: TrackAudio-SELCAL-win
          path: ta/dist/trackaudio-*.*

      # The FDD for Windows downloads this release when a controller agrees to install TrackAudio for Oceanic.
      # latest.json says which version it is and its SHA-256, so the app can check the download before it runs it.
      - name: Publish TrackAudio for Oceanic release
        if: github.event_name == 'push' && github.ref_name == 'trackaudio-selcal-build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem ta/dist -Filter "trackaudio-*-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "no installer found"; exit 1 }
          Copy-Item $exe.FullName TrackAudio-for-Oceanic-Setup.exe
          $sha = (Get-FileHash TrackAudio-for-Oceanic-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $ver = (Get-Content ta/package.json -Raw | ConvertFrom-Json).version
          $json = [ordered]@{ name = "TrackAudio for Oceanic"; trackaudioVersion = $ver; sha256 = $sha; built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ");
            url = "https://github.com/garythms/vatsim-NAAATS-v2/releases/download/trackaudio-oceanic/TrackAudio-for-Oceanic-Setup.exe";
            upstream = "https://github.com/pierr3/TrackAudio"; upstreamCommit = $env:TA_REF; source = "https://github.com/garythms/vatsim-NAAATS-v2/tree/master/tools/trackaudio-selcal" }
          $json | ConvertTo-Json | Set-Content latest.json
          gh release delete trackaudio-oceanic --repo ${{ github.repository }} --yes --cleanup-tag 2>$null
          gh release create trackaudio-oceanic --repo ${{ github.repository }} TrackAudio-for-Oceanic-Setup.exe latest.json --latest=false --prerelease --target ${{ github.sha }} --title "TrackAudio for Oceanic" --notes "A beta build of TrackAudio ($ver, GPL-3.0) with the kTransmitTones message for SELCAL on frequency. Built from pierr3/TrackAudio commit $env:TA_REF with the patches in tools/trackaudio-selcal. Installed by FDD for Windows when you agree to it."
